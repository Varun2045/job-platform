<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      margin: 0;
      padding: 16px;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #818cf8;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #131a26;
      border: 1px solid #232d3f;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    button {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Job Monitor Extension</h2>
  <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">Server URL</label>
  <input type="text" id="serverUrl" value="http://localhost:3000">

  <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">API Token</label>
  <input type="password" id="apiToken" placeholder="Paste JWT token...">

  <button id="saveBtn">Save Current Job</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
