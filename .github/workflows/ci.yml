name: Job Monitor Portal CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies (Root)
      run: npm ci

    - name: Install Dependencies (Frontend)
      run: |
        cd frontend
        npm ci

    - name: Run Linter
      run: npm run lint

    - name: Run Formatting Check
      run: npx prettier --check "src/**/*.ts"

    - name: Compile Backend TypeScript
      run: npm run build

    - name: Compile Frontend React
      run: |
        cd frontend
        npm run build

    - name: Run Test Suite with Coverage
      run: npm run test -- --coverage
      env:
        NODE_ENV: test
        IS_LOCAL: true

    - name: Upload Coverage Reports Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

    - name: Run Security & Dependency Audit
      run: npm audit --audit-level=high || true

  docker-verify:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image (Verification Only)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        tags: job-monitor-portal:latest
